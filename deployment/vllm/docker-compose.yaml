name: campus-vllm
services:
  vllm:
    image: vllm/vllm-openai:v0.9.2
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VLLM_PORT:-8001}:8000"
    volumes:
      - type: bind
        source: "${MODEL_DIR:?Set MODEL_DIR to an absolute AWQ model directory}"
        target: /models/qwen3-32b-awq
        read_only: true
        bind: {create_host_path: false}
    shm_size: 8gb
    environment:
      VLLM_API_KEY: "${VLLM_API_KEY:?Run deployment/init_env.py --mode production}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_DEVICE_0:-0}", "${GPU_DEVICE_1:-1}"]
              capabilities: [gpu]
    command:
      - --model
      - /models/qwen3-32b-awq
      - --served-model-name
      - Qwen3-32B-AWQ
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --tensor-parallel-size
      - '2'
      - --quantization
      - awq
      - --dtype
      - half
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN:-8192}"
      - --max-num-seqs
      - "${VLLM_MAX_NUM_SEQS:-4}"
      - --max-num-batched-tokens
      - '2048'
      - --gpu-memory-utilization
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.90}"
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 600s
    networks:
      inference:
        aliases: [vllm]
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: {max-size: 20m, max-file: '3'}
networks:
  inference:
    external: true
    name: campus-inference
