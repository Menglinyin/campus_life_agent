[build-system]
requires = ["setuptools>=68", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-life-agent"
version = "0.1.0"
description = "Campus life assistant with retrieval, modular tools and optional speech services"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[project.optional-dependencies]
workspace = ["PyYAML==6.0.3", "alembic==1.16.5", "Mako==1.4.3"]
rag = ["chromadb==1.0.12", "FlagEmbedding==1.3.5"]

[tool.setuptools]
package-dir = {"" = "backend"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app", "app.*", "skill_packages"]
namespaces = true

[tool.setuptools.package-data]
skill_packages = ["*/SKILL.md"]

[tool.setuptools.dynamic]
dependencies = {file = ["backend/requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "local_mcp: integration tests using local MCP servers",
    "chroma: optional local Chroma integration tests (enable with --run-chroma)",
]
