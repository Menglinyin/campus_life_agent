# Root entry for revision inspection: python -m alembic -c alembic.ini heads
# Apply migrations through python -m migrations.manage --env-file .env upgrade.
# The managed entry supplies connections and validates the existing schema.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os

# Do not put sqlalchemy.url or database credentials here.
# migrations/alembic.ini remains the configuration used by migrations.manage.
